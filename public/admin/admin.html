<!DOCTYPE html>
<html>
<head>
    <title>Admin - Human Replier</title>
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <h1>Secret Admin Panel</h1>
    <p>If a student is routed to HUMAN, their messages appear here.</p>
    
    <div id="adminChatBox"></div>
    
    <input type="text" id="adminInput" placeholder="Type reply here..." autocomplete="off">
    <!-- Store the current student's socket ID here invisibly -->
    <input type="hidden" id="targetStudentId"> 
    <button id="adminSendBtn">Send as Human</button>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/admin.js" defer></script>
</body>
</html>
