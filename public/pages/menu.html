<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Guess Who Am I?</title>
    <link rel="stylesheet" href="/css/app.css">
</head>

<body class="menu-page">

    <div class="top-bar">
    </div>

    <div class="container">
        <div class="panel">
            <div class="input-header">
                <span>Your in-game name is...</span>
                <div class="input-header-icon">i</div>
            </div>

            <div class="input-wrapper" id="inputWrapper">
                <input type="text" id="playerName" placeholder="Enter name">
                <button type="button" class="refresh-btn" id="clearNameButton" aria-label="Clear name">↻</button>
            </div>
            <div class="error-msg" id="errorMsg">Please enter a nickname to start!</div>

            <button type="button" class="start-btn" id="startButton">START</button>
        </div>

        <div class="settings-title">Settings</div>

        <div class="setting-row">
            <div class="setting-label">
                <svg class="setting-icon" viewBox="0 0 24 24">
                    <path
                        d="M9 18.5c0 1.93-1.57 3.5-3.5 3.5S2 20.43 2 18.5 3.57 15 5.5 15c.66 0 1.28.18 1.81.5V3h14v11.5c0 1.93-1.57 3.5-3.5 3.5S14 16.43 14 14.5s1.57-3.5 3.5-3.5c.66 0 1.28.18 1.81.5V7h-10v11.5z" />
                </svg>
                Sound effects
            </div>
            <label class="switch">
                <input type="checkbox" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="modal-backdrop" id="loadoutModal" role="dialog" aria-modal="true" aria-labelledby="loadoutTitle" hidden>
        <div class="modal-card wide">
            <p class="eyebrow">PRE-GAME / ROUND 1</p>
            <h1 id="loadoutTitle">Choose 2 powers</h1>
            <p>Pick any 2 powers before you play. You can use each power one time.</p>
            <div class="loadout-grid" id="loadoutGrid"></div>
            <p class="selection-count" id="selectionCount">0 of 2 selected</p>
            <button type="button" class="primary-btn" id="beginButton" disabled>BEGIN ROUND 1</button>
        </div>
    </div>

    <script src="/js/abilities.js"></script>
    <script src="/js/menu.js"></script>
</body>

</html>
