<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Who Am I? — Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>

    <div class="top-bar">
        <div class="top-bar-logo"><span>G</span> Guess Who Am I?</div>
        <div class="timer-badge" id="timerBadge"><span id="timerDisplay">2:00</span></div>
    </div>

    <div class="progress-wrap">
        <div class="progress-meta">
            <span>Time Remaining</span>
            <span id="progressLabel">120s</span>
        </div>
        <div class="progress-bar-track">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="main">

        <div id="preGame">
            <div class="pre-title">Get ready to interrogate!</div>
            <div class="pre-sub">Chat for 120 seconds, then decide — human or AI?</div>
        </div>

        <div id="gameArea">
            <div class="chat-card">
                <div class="chat-card-header">
                    <div class="chat-avatar">G</div>
                    <div class="chat-header-info">
                        <div class="chat-header-name" id="opponentName">Connecting...</div>
                        <div class="chat-header-sub">Human or AI? You decide.</div>
                    </div>
                    <div class="status-dot"></div>
                </div>
                <div id="chatBox">
                    <div class="empty-state" id="emptyState">
                        <div class="empty-state-text">Send your first message to start!</div>
                    </div>
                    <div class="typing-indicator" id="typingIndicator">
                        <div class="typing-dots"><span></span><span></span><span></span></div>
                    </div>
                </div>
                <div class="input-bar">
                    <input type="text" id="msgInput" placeholder="Type a message..." autocomplete="off" disabled>
                    <button id="sendBtn" disabled>
                        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div class="result-overlay" id="guessOverlay">
        <div class="result-card">
            <div class="result-title">Time's up!</div>
            <div class="result-sub">Were you chatting with a human or an AI? Guess right for +500 points.</div>
            <div class="guess-row">
                <button class="guess-btn human" id="guessHuman">HUMAN</button>
                <button class="guess-btn ai" id="guessAI">AI</button>
            </div>
        </div>
    </div>

    <div class="result-overlay" id="resultOverlay">
        <div class="result-card">
            <div class="result-title" id="resultTitle">Correct!</div>
            <div class="result-sub" id="resultSub"></div>
            <div class="result-score" id="resultScore"></div>
            <button class="result-play-again" id="playAgainButton">Play Again</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/chat.js" defer></script>
</body>
</html>
